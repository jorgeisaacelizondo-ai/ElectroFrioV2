<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clientes - ElectroFrío</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="../assets/icon.png?v=3" type="image/png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Estilos compartidos del sistema -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Firebase SDK (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/modo-seguro.js"></script>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            padding: 24px 30px;
            background-color: var(--bg-main, #0b1320);
            color: var(--text-primary, #ffffff);
            font-family: 'Inter', sans-serif;
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            align-items: stretch !important;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .clients-header-card {
            background-color: var(--bg-card, #16243d);
            border: 1px solid var(--border-color, #1e3656);
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .clients-header-title {
            margin: 0;
            font-size: 22px;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--color-blue, #00b4d8);
        }

        .clients-stats-pills {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color, #1e3656);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary, #94a3b8);
        }

        .stat-pill strong {
            color: #ffffff;
            font-weight: 700;
        }

        .btn-action-primary {
            background: var(--color-blue, #00b4d8);
            color: #000;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 9px 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            transition: all 0.2s ease;
        }

        .btn-action-primary:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* Search bar */
        .clients-search-container {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 20px;
            background: var(--bg-card, #16243d);
            padding: 12px 18px;
            border-radius: 10px;
            border: 1px solid var(--border-color, #1e3656);
        }

        .search-box-wrap {
            flex: 1;
            position: relative;
        }

        .search-box-input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            background: var(--bg-input, #0d1a2d);
            border: 1px solid var(--border-color, #1e3656);
            border-radius: 8px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .search-box-input:focus {
            border-color: var(--color-blue, #00b4d8);
        }

        .search-box-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted, #64748b);
            pointer-events: none;
        }

        /* Address cards in modal */
        .client-address-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color, #1e3656);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .client-history-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color, #1e3656);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .client-history-item-header {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            color: var(--color-blue, #00b4d8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        /* Toasts */
        #toastContainer {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .custom-toast {
            background: #16243d;
            border: 1px solid #1e3656;
            color: #fff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 13px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
            pointer-events: auto;
            animation: slideInToast 0.3s ease;
        }

        .custom-toast.success { border-color: #00e676; color: #00e676; }
        .custom-toast.error { border-color: #ef4444; color: #f87171; }
        .custom-toast.warning { border-color: #f59e0b; color: #f59e0b; }
        .custom-toast.info { border-color: #00b4d8; color: #00b4d8; }

        @keyframes slideInToast {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            body { padding: 14px; }
            .clients-header-card { flex-direction: column; align-items: stretch; }
            .custom-table thead { display: none; }
            .custom-table, .custom-table tbody, .custom-table tr, .custom-table td {
                display: block;
                width: 100%;
            }
            .custom-table tr {
                margin-bottom: 14px;
                border: 1px solid var(--border-color);
                border-radius: 10px;
                background: rgba(0, 0, 0, 0.2);
                padding: 10px;
            }
            .custom-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 8px 6px;
                border: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                font-size: 13px;
                text-align: right;
            }
            .custom-table td:last-child {
                border-bottom: none;
                justify-content: flex-end;
            }
            .custom-table td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--text-muted);
                text-align: left;
                margin-right: 10px;
                font-size: 11px;
                text-transform: uppercase;
            }
        }
    </style>
</head>
<body>

    <!-- CABECERA -->
    <div class="clients-header-card">
        <div>
            <h1 class="clients-header-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                    <circle cx="9" cy="7" r="4" />
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                    <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                </svg>
                <span>Base de Datos de Clientes</span>
            </h1>
        </div>

        <div class="clients-stats-pills">
            <div class="stat-pill">
                <span>Total Clientes:</span>
                <strong id="statTotalClients">0</strong>
            </div>
            <div class="stat-pill">
                <span>Con Domicilio:</span>
                <strong id="statClientsWithAddr">0</strong>
            </div>
        </div>

        <button type="button" class="btn-action-primary" onclick="openNewClientModal()">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            + Crear Nuevo Cliente
        </button>
    </div>

    <!-- BUSCADOR -->
    <div class="clients-search-container">
        <div class="search-box-wrap">
            <svg class="search-box-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" id="searchClientInput" class="search-box-input" placeholder="Buscar cliente por nombre, código, CUIT, dirección o teléfono...">
        </div>
    </div>

    <!-- TABLA DE CLIENTES -->
    <div class="content-card" style="width: 100%;">
        <div class="table-responsive">
            <table class="custom-table">
                <thead>
                    <tr>
                        <th>ID / Código</th>
                        <th>Nombre / Razón Social</th>
                        <th>Domicilio(s)</th>
                        <th>Teléfono</th>
                        <th>CUIT / DNI</th>
                        <th style="text-align: center;">Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientsTableBody">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL NUEVO / EDITAR CLIENTE (CENTRADO)    -->
    <!-- ========================================== -->
    <div id="modalNuevoClienteCentered" class="modal-overlay" style="z-index: 3000;">
        <div class="modal-card" style="max-width: 600px; width: 95%; background-color: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: 0 10px 30px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px;">
                <h3 id="clientModalTitle" style="margin: 0; font-size: 18px; color: var(--color-blue); display: flex; align-items: center; gap: 8px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                    <span>Nuevo Cliente</span>
                </h3>
                <button type="button" onclick="closeNewClientModal()" style="background: none; border: none; color: var(--text-secondary); font-size: 24px; cursor: pointer; line-height: 1;">&times;</button>
            </div>

            <form id="formNuevoClienteModal" onsubmit="handleSaveClientForm(event)" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="hidden" id="modal-client-id-edit" value="">

                <div class="input-group" style="margin: 0;">
                    <label style="font-size: 13px; font-weight: 600;">Nombre o Razón Social *</label>
                    <input type="text" id="modal-client-name" required placeholder="Ej: Supermercado Norte / Juan Pérez" style="width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px;">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="input-group" style="margin: 0;">
                        <label style="font-size: 13px; font-weight: 600;">Teléfono de Contacto</label>
                        <input type="text" id="modal-client-phone" placeholder="Ej: 3804-123456" style="width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px;">
                    </div>
                    <div class="input-group" style="margin: 0;">
                        <label style="font-size: 13px; font-weight: 600;">CUIT / DNI</label>
                        <input type="text" id="modal-client-cuit" placeholder="Ej: 20-12345678-9" style="width: 100%; padding: 10px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px;">
                    </div>
                </div>

                <div class="input-group" style="margin: 0;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <label style="font-size: 13px; font-weight: 600; margin: 0;">Domicilios y Ubicaciones Maps</label>
                        <button type="button" onclick="addClientAddressRow()" style="background: rgba(0, 180, 216, 0.15); border: 1px solid var(--color-blue); color: var(--color-blue); padding: 4px 10px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;">+ Agregar Domicilio</button>
                    </div>
                    <div id="clientAddressesContainer" style="display: flex; flex-direction: column; gap: 10px; max-height: 220px; overflow-y: auto; padding-right: 4px;">
                        <!-- Filas dinámicas -->
                    </div>
                </div>

                <div class="input-group" style="margin: 0;">
                    <label style="font-size: 13px; font-weight: 600;">Notas / Observaciones</label>
                    <textarea id="modal-client-notes" rows="2" placeholder="Notas sobre el cliente o equipamiento..." style="width: 100%; padding: 8px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px; resize: vertical; font-family: inherit; font-size: 13px;"></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 10px;">
                    <button type="button" onclick="closeNewClientModal()" class="save-btn" style="width: auto; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid var(--border-color); margin: 0; padding: 10px 18px;">Cancelar</button>
                    <button type="submit" class="save-btn" style="width: auto; margin: 0; padding: 10px 22px; background: var(--color-blue); color: #000; font-weight: 700;">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MODAL HISTORIAL CLIENTE                    -->
    <!-- ========================================== -->
    <div id="modalHistorialCliente" class="modal-overlay">
        <div class="modal-content" style="max-width: 650px;">
            <div class="modal-header">
                <h3 class="modal-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="margin-right: 6px; color: var(--color-blue);">
                        <path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    Historial de Trabajos - <span id="historyClientName" style="color: var(--color-blue); font-weight: 700;">Cliente</span>
                </h3>
                <button class="modal-close" onclick="closeHistoryModal()">&times;</button>
            </div>
            <div style="margin-top: 15px; max-height: 480px; overflow-y: auto; padding-right: 4px;">
                <div id="clientHistoryContainer">
                    <!-- Dinámico -->
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST CONTAINER -->
    <div id="toastContainer"></div>

    <script>
        // 1. CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAHtMvkoHg2-OQaLOZ1Jvlsp6Bi3_-LP-s",
            authDomain: "electrofriov2.firebaseapp.com",
            projectId: "electrofriov2",
            storageBucket: "electrofriov2.firebasestorage.app",
            messagingSenderId: "905702352769",
            appId: "1:905702352769:web:189206a202fc6c8393aa80",
            measurementId: "G-HDEMWY8T7C"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

        // 2. SINCRONIZACIÓN DE TEMA
        function applyTheme(theme) {
            if (theme === 'light') document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');
        }
        applyTheme(localStorage.getItem('electrofrio_theme') || 'dark');
        window.addEventListener('storage', (e) => {
            if (e.key === 'electrofrio_theme') applyTheme(e.newValue);
            if (e.key === 'electrofrio_clients') {
                try {
                    clientes = JSON.parse(e.newValue) || [];
                    renderClientsTable();
                } catch(err) {}
            }
        });

        // 3. ESTADO GLOBAL
        let clientes = [];
        let planillas = [];
        let ordenesTrabajo = [];

        // 4. TOAST NOTIFICATIONS
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
            toast.innerHTML = `<span>${icon}</span><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.transition = 'all 0.3s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100%)';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // 5. HELPER GOOGLE MAPS
        function getGoogleMapsUrl(address, clientOrMapsUrl) {
            if (!address && !clientOrMapsUrl) return '';

            let directUrl = '';
            if (typeof clientOrMapsUrl === 'string' && clientOrMapsUrl.trim()) {
                directUrl = clientOrMapsUrl.trim();
            } else if (clientOrMapsUrl && typeof clientOrMapsUrl === 'object') {
                const client = clientOrMapsUrl;
                if (client.addressMapsLinks && address && client.addressMapsLinks[address]) {
                    directUrl = client.addressMapsLinks[address];
                } else if (Array.isArray(client.addresses) && Array.isArray(client.addressesMaps)) {
                    const idx = client.addresses.indexOf(address);
                    if (idx !== -1 && client.addressesMaps[idx]) {
                        directUrl = client.addressesMaps[idx];
                    }
                }
                if (!directUrl && client.mapsUrl && (address === client.address || !address)) {
                    directUrl = client.mapsUrl;
                }
            }

            if (directUrl) {
                if (/^https?:\/\//i.test(directUrl)) return directUrl;
                if (/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(directUrl)) {
                    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(directUrl)}`;
                }
                return directUrl;
            }

            const cleanAddr = (address || '').trim();
            if (/^https?:\/\//i.test(cleanAddr)) return cleanAddr;
            if (/^-?\d+(\.\d+)?\s*,\s*-?\d+(\.\d+)?$/.test(cleanAddr)) {
                return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(cleanAddr)}`;
            }

            if (cleanAddr && cleanAddr.toLowerCase() !== 'sin especificar' && cleanAddr.toLowerCase() !== 'sin domicilio') {
                const query = cleanAddr.toLowerCase().includes('la rioja') ? cleanAddr : `${cleanAddr}, La Rioja`;
                return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
            }

            return '';
        }

        // 6. RENDERIZAR TABLA DE CLIENTES
        function renderClientsTable() {
            const tbody = document.getElementById('clientsTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            const searchVal = document.getElementById('searchClientInput') ? document.getElementById('searchClientInput').value.trim().toLowerCase() : '';

            const filteredClients = clientes.filter(c => {
                const addrsStr = (Array.isArray(c.addresses) ? c.addresses.join(' ') : (c.address || '')).toLowerCase();
                return (c.clientCode || c.id || '').toLowerCase().includes(searchVal) ||
                    (c.name || '').toLowerCase().includes(searchVal) ||
                    (c.cuit || '').toLowerCase().includes(searchVal) ||
                    addrsStr.includes(searchVal) ||
                    (c.phone || '').toLowerCase().includes(searchVal);
            });

            // Actualizar contadores
            document.getElementById('statTotalClients').textContent = clientes.length;
            const withAddrCount = clientes.filter(c => {
                const addrs = Array.isArray(c.addresses) ? c.addresses : [c.address];
                return addrs.some(a => a && a !== 'Sin especificar' && a !== 'Sin domicilio');
            }).length;
            document.getElementById('statClientsWithAddr').textContent = withAddrCount;

            if (filteredClients.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:30px;">No se encontraron clientes con el filtro de búsqueda.</td></tr>`;
                return;
            }

            filteredClients.forEach((c) => {
                const clientCode = c.clientCode || (c.id && (c.id.startsWith('CLI-') || c.id.startsWith('cli-')) ? c.id.toUpperCase() : (c.id || 'CLI-0000'));
                const addrsList = Array.isArray(c.addresses) && c.addresses.length > 0 ? c.addresses : [c.address || 'Sin domicilio'];
                
                const addrsHtml = addrsList.map(a => {
                    if (!a || a.toLowerCase() === 'sin especificar' || a.toLowerCase() === 'sin domicilio') {
                        return `<div style="font-size:12px; color:var(--text-muted); margin-bottom:2px;">📍 ${a || 'Sin especificar'}</div>`;
                    }
                    const mapsUrl = getGoogleMapsUrl(a, c);
                    const mapsBtn = mapsUrl ? `
                        <a href="${mapsUrl}" target="_blank" rel="noopener noreferrer" 
                           title="Abrir ubicación en Google Maps" 
                           style="display: inline-flex; align-items: center; gap: 3px; padding: 2px 7px; background: rgba(0, 180, 216, 0.15); border: 1px solid var(--color-blue); color: var(--color-blue); border-radius: 4px; font-size: 11px; font-weight: 600; text-decoration: none; margin-left: 6px; flex-shrink: 0;">
                            <span>🗺️ Maps</span>
                        </a>` : '';
                    return `<div style="font-size:12px; margin-bottom:4px; display:flex; align-items:center; flex-wrap:wrap; gap:4px;">
                        <span>📍 ${a}</span>
                        ${mapsBtn}
                    </div>`;
                }).join('');

                const phoneHtml = c.phone ? `
                    <div style="display:flex; align-items:center; gap:6px;">
                        <span>${c.phone}</span>
                        <a href="https://wa.me/${c.phone.replace(/\D/g, '')}" target="_blank" rel="noopener noreferrer" title="Enviar WhatsApp" style="color:#25d366; font-size:13px; text-decoration:none;">💬</a>
                    </div>
                ` : '<span style="color:var(--text-muted); font-style:italic;">Sin teléfono</span>';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td data-label="ID / Código" style="font-weight:700; color:var(--color-blue); font-size:12px;">${clientCode}</td>
                    <td data-label="Nombre" style="font-weight:600;">${c.name}</td>
                    <td data-label="Domicilio(s)">${addrsHtml}</td>
                    <td data-label="Teléfono">${phoneHtml}</td>
                    <td data-label="CUIT / DNI" style="font-size:12px;">${c.cuit || '-'}</td>
                    <td data-label="Acciones" style="text-align:center;">
                        <div style="display:flex; gap:6px; justify-content:center; flex-wrap:nowrap;">
                            <button class="save-btn" style="width:auto; margin:0; padding:5px 8px; font-size:11px;" onclick="openNewClientModal('${c.id}')">✏️ Editar</button>
                            <button class="save-btn" style="width:auto; margin:0; padding:5px 8px; font-size:11px; background-color:rgba(0,180,216,0.18); border:1px solid var(--color-blue); color:var(--color-blue);" onclick="viewClientHistory('${c.id}')">📋 Historial</button>
                            <button class="save-btn" style="width:auto; margin:0; padding:5px 8px; font-size:11px; background-color:#7a1a1a; color:white; border-color:#992020;" onclick="deleteClient('${c.id}')">🗑️</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 7. MODAL NUEVO / EDITAR CLIENTE
        window.openNewClientModal = function(clientId = null) {
            const modal = document.getElementById('modalNuevoClienteCentered');
            const title = document.getElementById('clientModalTitle');
            const form = document.getElementById('formNuevoClienteModal');
            const container = document.getElementById('clientAddressesContainer');
            if (!modal) return;

            if (form) form.reset();
            if (container) container.innerHTML = '';

            if (clientId) {
                const c = clientes.find(item => item.id === clientId);
                if (c) {
                    if (title) title.innerHTML = `<span>Editar Cliente: ${c.name}</span>`;
                    document.getElementById('modal-client-id-edit').value = c.id;
                    document.getElementById('modal-client-name').value = c.name || '';
                    document.getElementById('modal-client-phone').value = c.phone || '';
                    document.getElementById('modal-client-cuit').value = c.cuit || '';
                    document.getElementById('modal-client-notes').value = c.notes || '';

                    const addrs = Array.isArray(c.addresses) && c.addresses.length > 0 ? c.addresses : [c.address || ''];
                    const maps = Array.isArray(c.addressesMaps) ? c.addressesMaps : [];
                    addrs.forEach((a, i) => {
                        const mLink = (c.addressMapsLinks && c.addressMapsLinks[a]) ? c.addressMapsLinks[a] : (maps[i] || '');
                        addClientAddressRow(a, mLink);
                    });
                }
            } else {
                if (title) title.innerHTML = `<span>Nuevo Cliente</span>`;
                document.getElementById('modal-client-id-edit').value = '';
                addClientAddressRow('', '');
            }

            modal.classList.add('show');
        };

        window.closeNewClientModal = function() {
            const modal = document.getElementById('modalNuevoClienteCentered');
            if (modal) modal.classList.remove('show');
        };

        window.addClientAddressRow = function(val = '', mapsVal = '') {
            const container = document.getElementById('clientAddressesContainer');
            if (!container) return;

            const div = document.createElement('div');
            div.className = 'client-address-card';

            div.innerHTML = `
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span style="font-size: 14px; color: var(--color-blue); flex-shrink: 0;" title="Dirección física">📍</span>
                    <input type="text" class="modal-client-address-item" placeholder="Dirección / Calle y Altura (Ej: Av. San Martín 150)" style="flex: 1; padding: 8px 10px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px; font-size: 13px;">
                    <button type="button" class="btn-remove-addr-row" title="Eliminar este domicilio" style="background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.35); padding: 6px 10px; border-radius: 6px; font-weight: bold; cursor: pointer; flex-shrink: 0;">✕</button>
                </div>
                <div style="display: flex; gap: 8px; align-items: center;">
                    <span style="font-size: 14px; opacity: 0.85; flex-shrink: 0;" title="Link o coordenadas de Google Maps">🗺️</span>
                    <input type="text" class="modal-client-maps-item" placeholder="Pegar link de Google Maps (https://maps.app.goo.gl/...) o coordenadas" style="flex: 1; padding: 7px 10px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 6px; font-size: 12px;">
                    <button type="button" class="btn-open-maps-row" title="Abrir en Google Maps" style="background: rgba(0, 180, 216, 0.18); border: 1px solid var(--color-blue); color: var(--color-blue); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; flex-shrink: 0;">
                        <span>🗺️ Maps</span>
                    </button>
                </div>
            `;

            const addrInput = div.querySelector('.modal-client-address-item');
            const mapsInput = div.querySelector('.modal-client-maps-item');
            const btnRemove = div.querySelector('.btn-remove-addr-row');
            const btnMaps = div.querySelector('.btn-open-maps-row');

            if (addrInput) addrInput.value = val || '';
            if (mapsInput) mapsInput.value = mapsVal || '';

            btnRemove.addEventListener('click', () => div.remove());

            btnMaps.addEventListener('click', () => {
                const addr = addrInput ? addrInput.value.trim() : '';
                const mapLink = mapsInput ? mapsInput.value.trim() : '';
                const url = getGoogleMapsUrl(addr, mapLink);
                if (url) window.open(url, '_blank', 'noopener,noreferrer');
                else showToast("Ingresa una dirección o link para abrir Maps", "info");
            });

            if (addrInput && mapsInput) {
                addrInput.addEventListener('input', () => {
                    const text = addrInput.value.trim();
                    if (/^https?:\/\/(maps\.app\.goo\.gl|goo\.gl\/maps|www\.google\.[a-z.]+\/maps|maps\.google\.[a-z.]+)/i.test(text)) {
                        if (!mapsInput.value.trim()) {
                            mapsInput.value = text;
                            showToast("🔗 Link de Google Maps asignado", "info");
                        }
                    }
                });
            }

            container.appendChild(div);
        };

        window.handleSaveClientForm = async function(event) {
            event.preventDefault();

            const editId = document.getElementById('modal-client-id-edit').value;
            const name = document.getElementById('modal-client-name').value.trim();
            const cuit = document.getElementById('modal-client-cuit').value.trim();
            const phone = document.getElementById('modal-client-phone').value.trim();
            const notes = document.getElementById('modal-client-notes').value.trim();

            const cards = document.querySelectorAll('#clientAddressesContainer .client-address-card');
            const addresses = [];
            const addressesMaps = [];
            const addressMapsLinks = {};

            cards.forEach(card => {
                const addrInput = card.querySelector('.modal-client-address-item');
                const mapsInput = card.querySelector('.modal-client-maps-item');
                const aVal = addrInput ? addrInput.value.trim() : '';
                const mVal = mapsInput ? mapsInput.value.trim() : '';

                if (aVal || mVal) {
                    const finalAddr = aVal || (mVal ? 'Ubicación GPS' : '');
                    if (finalAddr) {
                        addresses.push(finalAddr);
                        addressesMaps.push(mVal || '');
                        if (mVal) addressMapsLinks[finalAddr] = mVal;
                    }
                }
            });

            if (!addresses.includes("Sin especificar")) {
                addresses.push("Sin especificar");
                addressesMaps.push("");
            }

            const clientData = {
                name: name,
                cuit: cuit,
                phone: phone,
                notes: notes,
                address: addresses[0] || 'Sin especificar',
                addresses: addresses,
                addressesMaps: addressesMaps,
                addressMapsLinks: addressMapsLinks
            };

            try {
                if (editId) {
                    clientData.id = editId;
                    await db.collection('clientes').doc(editId).update(clientData);
                    showToast("Cliente actualizado correctamente", "success");
                } else {
                    const docRef = await db.collection('clientes').add(clientData);
                    clientData.id = docRef.id;
                    showToast("Cliente creado con éxito", "success");
                }

                closeNewClientModal();
                window.parent.postMessage({ type: 'CLIENT_UPDATED' }, '*');
            } catch(err) {
                console.error("Error guardando cliente:", err);
                showToast("Error al guardar cliente: " + err.message, "error");
            }
        };

        // 8. ELIMINAR CLIENTE
        window.deleteClient = async function(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este cliente? Esto no borrará sus planillas de trabajo.")) {
                try {
                    await db.collection('clientes').doc(id).delete();
                    showToast("Cliente eliminado exitosamente", "success");
                    window.parent.postMessage({ type: 'CLIENT_UPDATED' }, '*');
                } catch (error) {
                    console.error("Error al eliminar cliente:", error);
                    showToast("Error al eliminar cliente", "error");
                }
            }
        };

        // 9. VER HISTORIAL DE CLIENTE
        window.viewClientHistory = function(id) {
            const client = clientes.find(c => c.id === id);
            if (!client) return;

            document.getElementById('historyClientName').textContent = client.name;
            const container = document.getElementById('clientHistoryContainer');
            container.innerHTML = '';

            const clientSheets = planillas.filter(p => p.clientId === id || (p.client && p.client.toLowerCase() === client.name.toLowerCase()));

            if (clientSheets.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--text-muted); padding:30px;">Este cliente aún no registra trabajos o planillas realizadas.</div>`;
            } else {
                clientSheets.sort((a, b) => new Date(b.date || b.timestamp) - new Date(a.date || a.timestamp));

                clientSheets.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'client-history-item';
                    div.innerHTML = `
                        <div class="client-history-item-header">
                            <span>📄 ${p.id || 'PDT'} - OT: ${p.orderId || '-'}</span>
                            <span>${p.date || 'Sin fecha'}</span>
                        </div>
                        <div style="margin-bottom:4px;"><strong>Trabajo Realizado:</strong> ${p.techDetails || 'Servicios técnicos'}</div>
                        <div style="margin-bottom:4px;"><strong>Materiales / Repuestos:</strong> ${p.spareParts || 'Ninguno'}</div>
                        <div style="margin-bottom:4px;"><strong>Observaciones:</strong> ${p.observations || 'Sin observaciones'}</div>
                        <div style="text-align:right; font-size:11px; color:var(--text-muted); margin-top:6px;">Técnico: ${p.completedBy || 'Técnico'}</div>
                    `;
                    container.appendChild(div);
                });
            }

            const modal = document.getElementById('modalHistorialCliente');
            if (modal) modal.classList.add('show');
        };

        window.closeHistoryModal = function() {
            const modal = document.getElementById('modalHistorialCliente');
            if (modal) modal.classList.remove('show');
        };

        // 10. FILTROS Y EVENT LISTENERS
        document.getElementById('searchClientInput')?.addEventListener('input', renderClientsTable);

        // Click outside modal
        ['modalNuevoClienteCentered', 'modalHistorialCliente'].forEach(mId => {
            const m = document.getElementById(mId);
            if (m) {
                m.addEventListener('click', (e) => {
                    if (e.target === m) m.classList.remove('show');
                });
            }
        });

        // 11. INICIALIZACIÓN Y FIRESTORE
        document.addEventListener('DOMContentLoaded', () => {
            const cachedClients = localStorage.getItem('electrofrio_clients');
            if (cachedClients) {
                try {
                    clientes = JSON.parse(cachedClients) || [];
                    renderClientsTable();
                } catch(e) {}
            }

            const cachedSheets = localStorage.getItem('electrofrio_worksheets');
            if (cachedSheets) {
                try { planillas = JSON.parse(cachedSheets) || []; } catch(e) {}
            }

            // Listener Clientes en Tiempo Real
            db.collection('clientes').onSnapshot(snap => {
                const list = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    list.push(data);
                });
                clientes = list;
                localStorage.setItem('electrofrio_clients', JSON.stringify(clientes));
                renderClientsTable();
            });

            // Listener Planillas
            db.collection('planillas').onSnapshot(snap => {
                const pList = [];
                snap.forEach(doc => {
                    const data = doc.data();
                    data.id = doc.id;
                    pList.push(data);
                });
                planillas = pList;
            });
        });
    </script>
</body>
</html>
