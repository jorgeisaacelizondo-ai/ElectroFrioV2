<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Tareas - ElectroFrío</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="../assets/icon.png?v=3" type="image/png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Estilos compartidos del sistema -->
    <link rel="stylesheet" href="../css/style.css">

    <!-- Firebase SDK (Compat v9) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="../js/modo-seguro.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            padding: 24px 30px;
            background-color: var(--bg-main, #0b1320);
            color: var(--text-primary, #ffffff);
            font-family: 'Inter', sans-serif;
            display: flex !important;
            flex-direction: column !important;
            justify-content: flex-start !important;
            align-items: stretch !important;
            box-sizing: border-box;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .tareas-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
            width: 100%;
        }

        #tareas-admin-container,
        #tareas-collab-container {
            width: 100%;
        }

        #searchInputTareasAdmin {
            width: 100%;
            background-color: var(--bg-input, #0a111c);
            border: 1px solid var(--border-color, #1e3656);
            color: var(--text-primary, #ffffff);
            padding: 10px 14px 10px 38px;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        #searchInputTareasAdmin:focus {
            border-color: var(--color-blue, #00bfff);
        }
        #searchInputTareasAdmin::placeholder {
            color: var(--text-muted, #627d98);
        }

        /* Botones de acción */
        .action-icon-btn {
            border: none;
            border-radius: 8px;
            width: 36px;
            height: 36px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .action-icon-btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }

        .btn-nueva-tarea {
            padding: 11px 18px;
            background-color: var(--color-blue, #00bfff);
            color: #0b1320;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(0, 191, 255, 0.25);
        }
        .btn-nueva-tarea:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        /* Barra de progreso interactiva */
        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }
        .progress-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        /* Insignias */
        .tarea-date-badge {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary, #8ab4f8);
        }

        .tarea-badge-status {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            display: inline-block;
        }

        .assignee-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 191, 255, 0.1);
            color: var(--color-blue, #00bfff);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .checklist-preview-box {
            background: rgba(10, 17, 28, 0.6);
            border: 1px solid rgba(30, 54, 86, 0.5);
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            width: 100%;
            box-sizing: border-box;
        }

        .checklist-preview-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 3px 0;
            font-size: 12px;
        }

        /* Ocultar elementos según rol */
        body.is-admin .role-collab-only { display: none !important; }
        body.is-collab .role-admin-only { display: none !important; }

        /* ==============================================================
           DISEÑO ADAPTADO A CELULARES Y PANTALLAS PEQUEÑAS (<= 768px)
           ============================================================== */
        @media (max-width: 768px) {
            body {
                padding: 14px 12px !important;
            }

            .tareas-header-row {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
                margin-bottom: 15px;
            }

            .tareas-header-row h2 {
                font-size: 20px !important;
                text-align: center;
            }

            .btn-nueva-tarea {
                width: 100%;
                justify-content: center;
                padding: 14px;
                font-size: 15px;
                border-radius: 10px;
            }

            .card-header {
                flex-direction: column !important;
                align-items: stretch !important;
                gap: 12px !important;
                padding: 14px !important;
            }

            .card-header > div[style*="max-width"] {
                max-width: 100% !important;
                width: 100% !important;
            }

            #searchInputTareasAdmin {
                height: 44px;
                font-size: 15px !important;
            }

            /* Desarmar la tabla y convertirla en Tarjetas Táctiles */
            .table-responsive {
                border: none !important;
                overflow: visible !important;
            }

            #table-tareas-admin thead {
                display: none !important;
            }

            #table-tareas-admin, 
            #tbody-tareas-admin {
                display: block !important;
                width: 100% !important;
            }

            #tbody-tareas-admin tr {
                display: flex !important;
                flex-direction: column !important;
                background: var(--bg-card, #16243d) !important;
                border: 1px solid var(--border-color, #1e3656) !important;
                border-radius: 14px !important;
                padding: 16px !important;
                margin-bottom: 14px !important;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25) !important;
                box-sizing: border-box;
            }

            #tbody-tareas-admin td {
                display: flex !important;
                width: 100% !important;
                padding: 5px 0 !important;
                border: none !important;
                box-sizing: border-box;
                text-align: left !important;
            }

            /* 1. Header de la tarjeta: Fecha a la izquierda, Estado a la derecha */
            #tbody-tareas-admin td[data-label="FECHA"] {
                order: 1;
                border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
                padding-bottom: 10px !important;
                margin-bottom: 10px;
            }

            .tarea-cell-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                width: 100%;
            }

            /* 2. Título principal de la tarea */
            #tbody-tareas-admin td[data-label="TAREA"] {
                order: 2;
                flex-direction: column !important;
                align-items: flex-start !important;
                padding: 0 0 10px 0 !important;
            }

            .tarea-title-wrap {
                width: 100%;
            }

            .tarea-title-wrap strong {
                font-size: 17px !important;
                color: #ffffff;
                display: block;
                margin-bottom: 8px;
                line-height: 1.35;
            }

            /* 3. Colaborador asignado */
            #tbody-tareas-admin td[data-label="ASIGNADO A"] {
                order: 3;
                padding: 4px 0 10px 0 !important;
            }

            /* 4. Barra de progreso */
            #tbody-tareas-admin td[data-label="PROGRESO"] {
                order: 4;
                padding: 0 0 12px 0 !important;
            }

            .tarea-progress-wrap {
                width: 100%;
            }

            /* 5. Fila inferior de botones de acción táctiles */
            #tbody-tareas-admin td[data-label="ACCIONES"] {
                order: 5;
                border-top: 1px solid rgba(255, 255, 255, 0.08) !important;
                padding-top: 12px !important;
                margin-top: 6px;
                display: flex !important;
                justify-content: flex-end !important;
                align-items: center !important;
                width: 100% !important;
            }

            .tarea-actions-wrap {
                display: flex !important;
                gap: 10px !important;
                justify-content: flex-end !important;
                width: 100% !important;
            }

            /* IMPORTANTE: Anular width: 100% que style.css ponía a botones dentro de td */
            .custom-table td button,
            .custom-table:not(.pdig-form-table) td button,
            .tarea-actions-wrap .action-icon-btn {
                width: 44px !important;
                height: 44px !important;
                min-width: 44px !important;
                margin: 0 !important;
                border-radius: 10px !important;
                font-size: 18px !important;
            }

            /* Tarjetas de Colaborador en celular */
            #tareas-collab-container {
                grid-template-columns: 1fr !important;
            }

            .collab-tarea-item-row {
                padding: 12px 14px !important;
                min-height: 48px;
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .collab-tarea-item-row input[type="checkbox"] {
                width: 24px !important;
                height: 24px !important;
            }

            /* Modal Adaptativo en celular */
            .modal-content {
                width: 95% !important;
                max-width: 95% !important;
                margin: 15px auto !important;
                max-height: 92vh !important;
                border-radius: 16px !important;
            }

            .modal-body {
                padding: 16px !important;
                max-height: calc(92vh - 70px) !important;
                overflow-y: auto !important;
            }

            input[type="text"],
            input[type="date"] {
                font-size: 16px !important; /* Previene auto-zoom molesto en iPhones */
            }
        }
    </style>
</head>
<body class="is-admin">

    <!-- ENCABEZADO DE TAREAS -->
    <div class="tareas-header-row">
        <h2 style="margin: 0; font-size: 24px; font-family: 'Outfit', sans-serif;">Gestión de Tareas</h2>
        <button class="btn-nueva-tarea role-admin-only" onclick="openModalNuevaTarea()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Nueva Tarea
        </button>
    </div>
    
    <!-- CONTENEDOR TAREAS ADMIN -->
    <div id="tareas-admin-container" class="role-admin-only">
        <div class="content-card">
            <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                <h3 class="card-title" style="margin: 0;">Todas las Tareas</h3>
                <div style="position: relative; width: 100%; max-width: 320px;">
                    <svg style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--text-muted, #9ca3af); pointer-events: none;" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                    <input type="text" id="searchInputTareasAdmin" placeholder="Buscar por título o colaborador..." oninput="renderTareas()">
                </div>
            </div>
            <div class="table-responsive">
                <table class="custom-table" id="table-tareas-admin">
                    <thead>
                        <tr>
                            <th>FECHA</th>
                            <th>TAREA</th>
                            <th>ASIGNADO A</th>
                            <th>PROGRESO</th>
                            <th>ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-tareas-admin">
                        <tr><td colspan="5" style="text-align:center; padding: 25px;">Cargando tareas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- CONTENEDOR TAREAS COLABORADOR -->
    <div id="tareas-collab-container" class="role-collab-only" style="display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
        <div class="content-card"><div style="padding:25px; text-align:center;">Cargando tareas asignadas...</div></div>
    </div>

    <!-- MODAL NUEVA / EDITAR TAREA -->
    <div id="modalNuevaTarea" class="modal-overlay">
        <div class="modal-content" style="max-width: 520px;">
            <div class="modal-header">
                <h3 class="modal-title">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                        <path d="M9 11l3 3L22 4"></path>
                        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                    </svg>
                    Crear Nueva Tarea
                </h3>
                <button type="button" class="modal-close" onclick="closeModalNuevaTarea()">&times;</button>
            </div>
            <div class="modal-body" style="padding: 20px;">
                <form id="formNuevaTarea" onsubmit="saveNuevaTarea(event)">
                    <input type="hidden" id="tarea-edit-id" value="">
                    
                    <div class="input-group" style="margin-bottom: 14px;">
                        <label style="display:block; margin-bottom: 6px; font-size: 13px; font-weight: 600;">Título / Descripción principal</label>
                        <input type="text" id="tarea-title" required placeholder="Ej: Revisión de Vehículos" style="width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px; box-sizing: border-box;">
                    </div>
                    
                    <div class="input-group" style="margin-bottom: 14px;">
                        <label style="display:block; margin-bottom: 6px; font-size: 13px; font-weight: 600;">Fecha</label>
                        <input type="date" id="tarea-date" required style="width: 100%; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px; box-sizing: border-box;">
                    </div>
                    
                    <div class="input-group" style="margin-bottom: 14px;">
                        <label style="display:block; margin-bottom: 6px; font-size: 13px; font-weight: 600;">Asignar a Colaboradores</label>
                        <div class="collab-checkbox-list" id="tarea-collabs-container" style="max-height: 140px; overflow-y: auto; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-input); display: flex; flex-direction: column; gap: 8px;">
                            <!-- Llenado dinámicamente -->
                        </div>
                    </div>
                    
                    <hr style="margin: 18px 0; border: none; border-top: 1px solid var(--border-color);">
                    
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <label style="margin: 0; font-weight: bold; font-size: 14px; color: var(--text-primary);">Checklist (Ítems a cumplir)</label>
                        <button type="button" onclick="addTareaItem()" style="padding: 8px 14px; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; color: var(--text-primary); font-size: 13px; font-weight: 600;">+ Añadir Ítem</button>
                    </div>
                    <div id="tarea-items-container" style="display: flex; flex-direction: column; gap: 10px;">
                        <div class="tarea-item-row" style="display: flex; gap: 10px; align-items: center;">
                            <input type="text" class="tarea-item-input" required placeholder="Ej: Controlar aceite" style="flex: 1; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px;">
                            <button type="button" onclick="this.parentElement.remove()" style="color: var(--color-red); background: none; border: none; cursor: pointer; font-size: 22px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;">&times;</button>
                        </div>
                    </div>

                    <button type="submit" class="login-btn btn-save" style="background-color: var(--color-blue); color: #0b1320; font-weight: 700; margin-top: 22px; width: 100%; padding: 14px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px;">
                        Crear Tarea
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- ==================== LÓGICA JAVASCRIPT ==================== -->
    <script>
        // 1. CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAHtMvkoHg2-OQaLOZ1Jvlsp6Bi3_-LP-s",
            authDomain: "electrofriov2.firebaseapp.com",
            projectId: "electrofriov2",
            storageBucket: "electrofriov2.firebasestorage.app",
            messagingSenderId: "905702352769",
            appId: "1:905702352769:web:189206a202fc6c8393aa80",
            measurementId: "G-HDEMWY8T7C"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

        // 2. SINCRONIZACIÓN DE TEMA CLARO / OSCURO
        function applyTheme(theme) {
            if (theme === 'light') {
                document.body.classList.add('light-mode');
            } else {
                document.body.classList.remove('light-mode');
            }
        }
        const savedTheme = localStorage.getItem('electrofrio_theme') || 'dark';
        applyTheme(savedTheme);
        window.addEventListener('storage', (e) => {
            if (e.key === 'electrofrio_theme') applyTheme(e.newValue);
        });

        // 3. ESTADO LOCAL
        let tareas = [];
        let colaboradores = [];
        let role = localStorage.getItem('electrofrio_role') || 'Administrador';
        let userName = localStorage.getItem('electrofrio_name') || 'Admin';

        function syncRoleUI() {
            if (role === 'Administrador') {
                document.body.classList.add('is-admin');
                document.body.classList.remove('is-collab');
            } else {
                document.body.classList.add('is-collab');
                document.body.classList.remove('is-admin');
            }
        }
        syncRoleUI();

        // 4. CARGA DE COLABORADORES
        function cargarColaboradores() {
            const localCollabs = localStorage.getItem('electrofrio_colaboradores');
            if (localCollabs) {
                try { colaboradores = JSON.parse(localCollabs); } catch(e){}
            }
            db.collection('usuarios').onSnapshot((snapshot) => {
                const list = [];
                snapshot.forEach(doc => list.push(doc.data()));
                if (list.length > 0) {
                    colaboradores = list;
                    localStorage.setItem('electrofrio_colaboradores', JSON.stringify(list));
                }
            }, err => console.warn("Aviso al sincronizar colaboradores:", err));
        }
        cargarColaboradores();

        // 5. SINCRONIZACIÓN EN TIEMPO REAL DE TAREAS
        db.collection('tareas').onSnapshot((snapshot) => {
            const list = [];
            snapshot.forEach(doc => {
                const data = doc.data();
                data.id = doc.id;
                list.push(data);
            });
            tareas = list;
            localStorage.setItem('electrofrio_tareas', JSON.stringify(tareas));
            renderTareas();
        }, (err) => {
            console.warn("Aviso al sincronizar tareas:", err);
            const cached = localStorage.getItem('electrofrio_tareas');
            if (cached) {
                try { tareas = JSON.parse(cached); } catch(e){}
                renderTareas();
            }
        });

        // 6. FUNCIONES MODAL
        window.openModalNuevaTarea = function() {
            const container = document.getElementById('tarea-collabs-container');
            container.innerHTML = '';
            
            const activeCollabs = colaboradores.filter(c => c.estado !== 'Inactivo' && c.role !== 'Administrador');
            if (activeCollabs.length === 0) {
                container.innerHTML = '<span style="font-size:12px; color:var(--text-muted); padding:6px;">No hay colaboradores disponibles</span>';
            } else {
                activeCollabs.forEach(c => {
                    const div = document.createElement('div');
                    div.innerHTML = `<label style="display:flex; align-items:center; gap:10px; font-weight:normal; cursor:pointer; padding:3px 0;"><input type="checkbox" class="tarea-collab-cb" value="${c.name}" style="width:18px; height:18px;"> <span>${c.name}</span></label>`;
                    container.appendChild(div);
                });
            }

            const today = new Date().toISOString().split('T')[0];
            document.getElementById('tarea-date').value = today;
            document.getElementById('formNuevaTarea').reset();
            document.getElementById('tarea-date').value = today;
            
            document.getElementById('tarea-items-container').innerHTML = `
                <div class="tarea-item-row" style="display:flex; gap:10px; align-items:center;">
                    <input type="text" class="tarea-item-input" required placeholder="Ej: Controlar aceite" style="flex:1; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px;">
                    <button type="button" onclick="this.parentElement.remove()" style="color:var(--color-red); background:none; border:none; cursor:pointer; font-size:22px; width:36px; height:36px;">&times;</button>
                </div>
            `;
            
            document.getElementById('tarea-edit-id').value = '';
            const titleEl = document.querySelector('#modalNuevaTarea .modal-title');
            if (titleEl) titleEl.innerHTML = `Crear Nueva Tarea`;
            
            const btnSave = document.querySelector('#formNuevaTarea .btn-save');
            if (btnSave) { btnSave.innerHTML = 'Crear Tarea'; btnSave.style.display = 'block'; }
            
            document.getElementById('modalNuevaTarea').classList.add('show');
        };

        window.closeModalNuevaTarea = function() {
            document.getElementById('modalNuevaTarea').classList.remove('show');
            const btnSave = document.querySelector('#formNuevaTarea .btn-save');
            if (btnSave) btnSave.style.display = 'block';
            document.getElementById('tarea-title').readOnly = false;
            document.getElementById('tarea-date').readOnly = false;
            document.querySelectorAll('.tarea-collab-cb').forEach(cb => cb.disabled = false);
        };

        window.addTareaItem = function() {
            const row = document.createElement('div');
            row.className = 'tarea-item-row';
            row.style.cssText = 'display:flex; gap:10px; align-items:center;';
            row.innerHTML = `<input type="text" class="tarea-item-input" required placeholder="Nuevo ítem..." style="flex:1; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px;"><input type="hidden" class="tarea-item-checked" value="false"><button type="button" onclick="this.parentElement.remove()" style="color:var(--color-red); background:none; border:none; cursor:pointer; font-size:22px; width:36px; height:36px;">&times;</button>`;
            document.getElementById('tarea-items-container').appendChild(row);
        };

        window.saveNuevaTarea = async function(e) {
            e.preventDefault();
            const title = document.getElementById('tarea-title').value;
            const date = document.getElementById('tarea-date').value;
            
            const collabsChecks = document.querySelectorAll('.tarea-collab-cb:checked');
            const assignees = Array.from(collabsChecks).map(cb => cb.value);
            
            if (assignees.length === 0) {
                alert("Debes asignar la tarea a al menos un colaborador.");
                return;
            }

            const itemRows = document.querySelectorAll('.tarea-item-row');
            const items = Array.from(itemRows).map(row => {
                const inp = row.querySelector('.tarea-item-input');
                const chk = row.querySelector('.tarea-item-checked');
                return { text: inp ? inp.value : '', checked: chk && chk.value === 'true' };
            });

            if (items.length === 0) {
                alert("Debes añadir al menos un ítem al checklist.");
                return;
            }

            const editId = document.getElementById('tarea-edit-id').value;
            
            try {
                const btn = e.target.querySelector('.btn-save');
                btn.innerHTML = 'Guardando...';
                btn.disabled = true;

                if (editId) {
                    const updatedData = { title, date, assignees, items };
                    await db.collection('tareas').doc(editId).update(updatedData);
                } else {
                    const tareaObj = {
                        id: `tarea-${Date.now()}`,
                        title,
                        date,
                        assignees,
                        items,
                        status: 'Pendiente',
                        timestamp: new Date().toISOString(),
                        createdBy: userName
                    };
                    await db.collection('tareas').doc(tareaObj.id).set(tareaObj);
                }
                closeModalNuevaTarea();
            } catch (err) {
                console.error("Error al guardar tarea:", err);
                alert("Error al guardar la tarea");
            } finally {
                const btn = e.target.querySelector('.btn-save');
                if (btn) { btn.innerHTML = 'Crear Tarea'; btn.disabled = false; }
            }
        };

        window.openEditTareaModal = function(id) {
            const t = tareas.find(x => x.id === id);
            if (!t) return;
            
            openModalNuevaTarea();
            
            document.getElementById('tarea-edit-id').value = id;
            const titleEl = document.querySelector('#modalNuevaTarea .modal-title');
            if (titleEl) titleEl.innerHTML = `✏️ Editar Tarea`;
            const btnSave = document.querySelector('#formNuevaTarea .btn-save');
            if (btnSave) { btnSave.innerHTML = 'Guardar Cambios'; btnSave.style.display = 'block'; }
            
            document.getElementById('tarea-title').value = t.title;
            document.getElementById('tarea-date').value = t.date;
            
            const collabsChecks = document.querySelectorAll('.tarea-collab-cb');
            collabsChecks.forEach(cb => {
                cb.checked = (t.assignees || []).includes(cb.value);
            });
            
            const itemsContainer = document.getElementById('tarea-items-container');
            itemsContainer.innerHTML = '';
            (t.items || []).forEach(item => {
                const row = document.createElement('div');
                row.className = 'tarea-item-row';
                row.style.cssText = 'display:flex; gap:10px; align-items:center; margin-bottom:8px;';
                row.innerHTML = `<input type="text" class="tarea-item-input" required value="${item.text}" style="flex:1; padding: 12px; background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 8px;"><input type="hidden" class="tarea-item-checked" value="${item.checked ? 'true' : 'false'}"><button type="button" onclick="this.parentElement.remove()" style="color:var(--color-red); background:none; border:none; cursor:pointer; font-size:22px; width:36px; height:36px;">&times;</button>`;
                itemsContainer.appendChild(row);
            });
        };

        window.openViewTareaModal = function(id) {
            const t = tareas.find(x => x.id === id);
            if (!t) return;
            
            openEditTareaModal(id);
            const titleEl = document.querySelector('#modalNuevaTarea .modal-title');
            if (titleEl) titleEl.innerHTML = `👁️ Ver Tarea`;
            
            const btnSave = document.querySelector('#formNuevaTarea .btn-save');
            if (btnSave) btnSave.style.display = 'none';
            
            document.getElementById('tarea-title').readOnly = true;
            document.getElementById('tarea-date').readOnly = true;
            
            const collabsChecks = document.querySelectorAll('.tarea-collab-cb');
            collabsChecks.forEach(cb => cb.disabled = true);
            
            const itemInputs = document.querySelectorAll('.tarea-item-input');
            itemInputs.forEach(i => i.readOnly = true);
            
            const addBtn = document.querySelector('button[onclick="addTareaItem()"]');
            if (addBtn) addBtn.style.display = 'none';
            
            const removeBtns = document.querySelectorAll('.tarea-item-row button');
            removeBtns.forEach(b => b.style.display = 'none');
        };

        window.deleteTarea = async function(id) {
            if (!confirm("¿Estás seguro de eliminar esta tarea?")) return;
            try {
                await db.collection('tareas').doc(id).delete();
            } catch (e) {
                console.error(e);
                alert("Error al eliminar");
            }
        };

        window.toggleTareaItemCollab = function(tareaId, itemIndex, isChecked) {
            const t = tareas.find(x => x.id === tareaId);
            if (t && t.items && t.items[itemIndex]) {
                t.items[itemIndex].checked = isChecked;
            }
        };

        window.saveTareaProgress = async function(tareaId) {
            const btn = document.getElementById('btn-save-tarea-' + tareaId);
            if (btn) { btn.innerHTML = '⏳ Guardando...'; btn.disabled = true; }
            const t = tareas.find(x => x.id === tareaId);
            if (!t) return;
            
            try {
                await db.collection('tareas').doc(tareaId).update({
                    items: t.items
                });
                if (btn) { 
                    btn.innerHTML = '✅ Guardado'; 
                    setTimeout(() => { if (btn) { btn.innerHTML = '💾 Guardar Cambios'; btn.disabled = false; } }, 2000); 
                }
            } catch (e) {
                console.error(e);
                alert("Error al guardar progreso");
                if (btn) { btn.innerHTML = '💾 Guardar Cambios'; btn.disabled = false; }
            }
        };

        function getTareaProgreso(t) {
            if (!t.items || t.items.length === 0) return 0;
            const total = t.items.length;
            const done = t.items.filter(x => x.checked).length;
            return done / total;
        }

        // 7. RENDERIZADO DE TAREAS
        function renderTareas() {
            if (role === 'Administrador') {
                const tbody = document.getElementById('tbody-tareas-admin');
                if (!tbody) return;
                
                const sorted = [...tareas].sort((a,b) => {
                    const pA = getTareaProgreso(a);
                    const pB = getTareaProgreso(b);
                    if (pA !== pB) return pA - pB;
                    return (b.timestamp || '').localeCompare(a.timestamp || '');
                });

                const searchInput = document.getElementById('searchInputTareasAdmin');
                const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
                const filtered = sorted.filter(t => {
                    if (!searchTerm) return true;
                    const matchTitle = (t.title || '').toLowerCase().includes(searchTerm);
                    const matchAssignee = (t.assignees || []).join(', ').toLowerCase().includes(searchTerm);
                    return matchTitle || matchAssignee;
                });

                let html = '';
                filtered.forEach(t => {
                    const total = (t.items || []).length;
                    const done = (t.items || []).filter(x => x.checked).length;
                    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                    
                    const fParts = (t.date || '').split('-');
                    const dateAr = fParts.length === 3 ? `${fParts[2]}/${fParts[1]}/${fParts[0]}` : t.date;
                    const pColor = pct === 100 ? '#4cd964' : (pct > 0 ? '#ffb300' : 'var(--text-secondary)');
                    const statusText = pct === 100 ? '✅ Completada' : (pct > 0 ? '⏳ En curso' : '📋 Pendiente');
                    const statusBg = pct === 100 ? 'rgba(76,217,100,0.15)' : (pct > 0 ? 'rgba(255,179,0,0.15)' : 'rgba(255,255,255,0.08)');
                    
                    let checklistPreview = `<div class="checklist-preview-box">`;
                    (t.items || []).forEach(i => {
                        checklistPreview += `<div class="checklist-preview-item" style="color: ${i.checked ? 'var(--text-muted); text-decoration:line-through;' : 'var(--text-primary);'}">
                            <span>${i.checked ? '✅' : '⬜'}</span>
                            <span>${i.text}</span>
                        </div>`;
                    });
                    checklistPreview += `</div>`;

                    html += `<tr>
                        <td data-label="FECHA">
                            <div class="tarea-cell-header">
                                <span class="tarea-date-badge">📅 ${dateAr}</span>
                                <span class="tarea-badge-status" style="background:${statusBg}; color:${pColor}; font-weight:700;">${statusText} • ${done}/${total} (${pct}%)</span>
                            </div>
                        </td>
                        <td data-label="TAREA">
                            <div class="tarea-title-wrap">
                                <strong>${t.title}</strong>
                                ${checklistPreview}
                            </div>
                        </td>
                        <td data-label="ASIGNADO A">
                            <span class="assignee-pill">👤 ${(t.assignees || []).join(', ') || 'Sin asignar'}</span>
                        </td>
                        <td data-label="PROGRESO">
                            <div class="tarea-progress-wrap">
                                <div style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:2px;">
                                    <span style="color:var(--text-muted);">Progreso:</span>
                                    <span style="color:${pColor}; font-weight:bold;">${done}/${total} (${pct}%)</span>
                                </div>
                                <div class="progress-bar-bg">
                                    <div class="progress-bar-fill" style="width:${pct}%; background-color:${pColor};"></div>
                                </div>
                            </div>
                        </td>
                        <td data-label="ACCIONES">
                            <div class="tarea-actions-wrap">
                                <button class="action-icon-btn btn-view" onclick="openViewTareaModal('${t.id}')" title="Ver Detalle" style="background-color: var(--color-blue); color: #0b1320;">👁️</button>
                                <button class="action-icon-btn btn-edit" onclick="openEditTareaModal('${t.id}')" title="Editar Tarea" style="background-color: #f39c12; color: #ffffff;">✏️</button>
                                <button class="action-icon-btn btn-delete" onclick="deleteTarea('${t.id}')" title="Eliminar Tarea" style="background-color: #d32f2f; color: #ffffff;">🗑️</button>
                            </div>
                        </td>
                    </tr>`;
                });

                if (filtered.length === 0) {
                    if (searchTerm) {
                        html = `<tr><td colspan="5" style="text-align:center; padding: 40px 20px; color: var(--text-muted);">
                            <span>No se encontraron tareas para la búsqueda: "<b>${searchTerm}</b>"</span>
                        </td></tr>`;
                    } else {
                        html = `<tr><td colspan="5" style="text-align:center; padding: 35px; color: var(--text-muted);">No hay tareas activas</td></tr>`;
                    }
                }
                tbody.innerHTML = html;
            } else {
                const container = document.getElementById('tareas-collab-container');
                if (!container) return;
                
                const myTareas = tareas.filter(t => (t.assignees || []).includes(userName) || (t.assignees || []).includes(localStorage.getItem('electrofrio_user')));
                const sorted = [...myTareas].sort((a,b) => {
                    const pA = getTareaProgreso(a);
                    const pB = getTareaProgreso(b);
                    if (pA !== pB) return pA - pB;
                    return (b.timestamp || '').localeCompare(a.timestamp || '');
                });
                
                let html = '';
                sorted.forEach(t => {
                    const fParts = (t.date || '').split('-');
                    const dateAr = fParts.length === 3 ? `${fParts[2]}/${fParts[1]}/${fParts[0]}` : t.date;
                    const total = (t.items || []).length;
                    const done = (t.items || []).filter(x => x.checked).length;
                    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
                    const pColor = pct === 100 ? '#4cd964' : (pct > 0 ? '#ffb300' : 'var(--text-secondary)');
                    
                    let itemsHtml = '';
                    (t.items || []).forEach((item, idx) => {
                        itemsHtml += `<label class="collab-tarea-item-row" style="background:var(--bg-input); border:1px solid var(--border-color); border-radius:10px; margin-bottom:10px; cursor:pointer;">
                            <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleTareaItemCollab('${t.id}', ${idx}, this.checked)">
                            <span style="${item.checked ? 'color:var(--text-muted); text-decoration:line-through;' : 'color:var(--text-primary); font-weight:500;'}">${item.text}</span>
                        </label>`;
                    });

                    html += `<div class="content-card" style="display:flex; flex-direction:column; border-radius:14px;">
                        <div class="card-header" style="flex-direction:column; align-items:flex-start; gap:6px; padding:16px;">
                            <div style="display:flex; justify-content:space-between; align-items:center; width:100%;">
                                <span class="tarea-date-badge">📅 ${dateAr}</span>
                                <span class="tarea-badge-status" style="background:${pct===100?'rgba(76,217,100,0.15)':'rgba(255,179,0,0.15)'}; color:${pColor}; font-weight:700;">${done}/${total} (${pct}%)</span>
                            </div>
                            <h3 class="card-title" style="margin:4px 0 0 0; font-size:18px;">${t.title}</h3>
                            <div class="progress-bar-bg" style="margin-top:8px;">
                                <div class="progress-bar-fill" style="width:${pct}%; background-color:${pColor};"></div>
                            </div>
                        </div>
                        <div style="padding:16px; flex:1;">
                            ${itemsHtml}
                        </div>
                        <div style="padding:14px 16px; border-top:1px solid var(--border-color); text-align:right;">
                            <button id="btn-save-tarea-${t.id}" onclick="saveTareaProgress('${t.id}')" style="padding: 13px 20px; background-color: #2e7d32; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; width:100%; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px;">
                                💾 Guardar Cambios
                            </button>
                        </div>
                    </div>`;
                });
                
                if (sorted.length === 0) {
                    html = `<div class="content-card"><div style="padding:35px; text-align:center; color:var(--text-muted);">No tienes tareas asignadas.</div></div>`;
                }
                container.innerHTML = html;
            }
        }
    </script>
</body>
</html>
